<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .emoji { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 2.2rem; color: #58d68d; margin-bottom: 0.5rem; }
    p { color: #8b949e; margin-bottom: 2rem; font-size: 1rem; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      color: #58d68d;
      text-decoration: none;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-size: 0.95rem;
      transition: border-color 0.15s, background 0.15s;
    }
    a:hover { border-color: #58d68d; background: rgba(88,214,141,0.07); }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🌱</div>
    <h1>Sprout</h1>
    <p>A farming simulator Discord bot. Plant crops, collect tools, and grow your garden.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
